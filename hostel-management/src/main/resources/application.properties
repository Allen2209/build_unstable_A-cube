spring.application.name=hostel-management
server.port=8080

# ---- Database: MySQL ----
# The database "hosteldb" is created automatically if it does not exist.
# CHANGE the username / password below to your own MySQL login.
spring.datasource.url=jdbc:mysql://localhost:3306/hosteldb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=allen2209
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# "update" creates the tables on first run and keeps the data afterwards
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
