<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Hostel Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-box">
    <h2>Student Registration</h2>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <label>Full Name</label>
        <input type="text" th:field="*{name}">
        <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>

        <label>Email</label>
        <input type="email" th:field="*{email}">
        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label>Contact Number</label>
        <input type="text" th:field="*{phone}" maxlength="10">
        <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>

        <label>Department</label>
        <input type="text" th:field="*{department}">

        <label>Password</label>
        <input type="password" name="password">
        <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

        <br><br>
        <button class="btn" type="submit">Register</button>
    </form>
    <p>Already registered? <a th:href="@{/login}">Login</a></p>
</div>
</body>
</html>
