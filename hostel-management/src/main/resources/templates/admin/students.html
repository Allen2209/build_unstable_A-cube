<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Students</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <div class="top-bar">
        <h2>Registered Students</h2>
        <a class="btn" th:href="@{/admin/students/new}">+ Add Student</a>
    </div>
    <table>
        <tr><th>Name</th><th>Email</th><th>Contact</th><th>Department</th><th>Actions</th></tr>
        <tr th:each="s : ${students}">
            <td th:text="${s.name}"></td>
            <td th:text="${s.email}"></td>
            <td th:text="${s.phone}"></td>
            <td th:text="${s.department}"></td>
            <td>
                <div class="row-form">
                    <a class="btn small" th:href="@{/admin/students/edit/{id}(id=${s.id})}">Edit</a>
                    <form th:action="@{/admin/students/delete/{id}(id=${s.id})}" method="post"
                          onsubmit="return confirm('Delete this student record?')">
                        <button class="btn small red" type="submit">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(students)}"><td colspan="5">No students registered.</td></tr>
    </table>
</div>
</body>
</html>
